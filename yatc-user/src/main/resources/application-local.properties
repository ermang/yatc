spring.application.name=yatc-user

server.port=8082

spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.open-in-view=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/yatc
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=root
spring.datasource.password=root

logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=ERROR

spring.jpa.show-sql=true

#kafka-stuff
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.ack-mode=manual
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

yatc.kafka.usercreatedevent.topic=user-created-t
yatc.kafka.usercreatedevent.group=group1

#actuator stuff
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

#logging
#logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

logging.file.name=logs/yatc-user.log
logging.structured.format.file=ecs

#zipkin_stuff
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
