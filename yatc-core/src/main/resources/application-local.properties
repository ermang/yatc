spring.application.name=yatc-core

server.port=8082

spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.open-in-view=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/yatc
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=root
spring.datasource.password=root

logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=ERROR

spring.jpa.show-sql=true

#kafka_stuff
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
yatc.kafka.followevent.topic=follow-t
yatc.kafka.followevent.group=group1
yatc.kafka.usercreatedevent.topic=user-created-t
yatc.kafka.usercreatedevent.group=group1
